[project]
name = "swarm-squad-ep1"
version = "0.3.0"
description = "Educational UAV swarm simulation with web GUI, chat control, and Python API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "ollama>=0.4",
    "qdrant-client>=1.12",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.2.2",
    "jinja2>=3.1",
    "numpy>=1.26",
    "cryptography>=50.0.0",
    "pathfinding3d>=0.7.2",
    "matplotlib>=3.10.8",
    "sentence-transformers>=5.5.1",
    "pre-commit>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.5.1",
]
research = [
    "matplotlib>=3.10.8",
    "pandas>=2.2",
]

[project.scripts]
swarm-squad-ep1 = "swarm_squad_ep1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src/swarm_squad_ep1/gui/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_squad_ep1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live local services (e.g., Qdrant/Ollama) to be available",
    "api: API contract and endpoint behavior tests",
    "frontend_contract: frontend bootstrap/static/API contract tests",
]

[tool.ruff]
lint.ignore = ["E402"]

[tool.uv]
constraint-dependencies = [
    "h2>=4.4.1",
    "idna>=3.15",
    "pillow>=12.3.0",
    "protobuf>=6.33.5",
    "pygments>=2.20.0",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    "torch>=2.13.0",
    "urllib3>=2.7.0",
]
